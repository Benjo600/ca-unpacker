# Auto-builds the Windows installer on every code push to main.
#
# What it produces for the operator:
#   - a prerelease tag v<version> whose only asset is CAUnpacker-Setup-<version>.exe
#   - the release body carries the exact size + sha256 so the admin dashboard
#     ("New features" tab) can prefill a Supabase release draft without a token.
#
# Nothing user-facing ships from here: installed apps only take updates that
# the admin publishes from the Supabase control plane.

name: build-installer

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "designs/**"
      - "docs/**"
      - "supabase/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compute CI version (patch = run number)
        id: version
        run: python installer/ci_bump.py

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt pyinstaller

      - name: Build CAUnpacker.exe
        run: python -m PyInstaller --noconfirm --clean CAUnpacker.spec

      - name: Bundle Tesseract if present
        run: python installer/bundle_tesseract.py
        continue-on-error: true

      - name: Build CAUnpackerUpdater.exe
        run: |
          python -m PyInstaller --noconfirm --clean CAUnpackerUpdater.spec
          Copy-Item dist\CAUnpackerUpdater.exe dist\CAUnpacker\CAUnpackerUpdater.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 was not installed by chocolatey" }
          & $iscc "/DAppVersion=$($env:CI_VERSION)" installer\ca-unpacker.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path dist\CAUnpacker-Setup.exe)) { throw "Setup exe missing after build" }
        env:
          CI_VERSION: ${{ steps.version.outputs.version }}

      - name: Notes, size and fingerprint
        shell: pwsh
        run: |
          $tag = ""
          $tags = @(git tag -l "v*")
          if ($tags.Count -gt 0) {
            $tag = $tags | Select-Object -Last 1
          }
          if ($tag) {
            $logLines = @(git log "$($tag)..HEAD" --pretty=format:"- %s")
          } else {
            $logLines = @(git log -40 --pretty=format:"- %s")
          }
          $notes = @(
            "Auto-built installer pushed by CI from commit $($env:GITHUB_SHA.Substring(0, 7)).",
            "",
            "### What changed",
            ($logLines | Select-Object -First 40),
            "",
            "sha256: $((Get-FileHash dist\CAUnpacker-Setup.exe -Algorithm SHA256).Hash.ToLower())",
            "size: $((Get-Item dist\CAUnpacker-Setup.exe).Length)"
          )
          $notes | Out-File -FilePath build-notes.txt -Encoding utf8
        env:
          CI_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish prerelease
        shell: pwsh
        run: |
          $version = $env:CI_VERSION
          $tag = "v$version"
          $view = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag dist\CAUnpacker-Setup.exe `
            --prerelease `
            --title "v$version CI build" `
            --notes-file build-notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_VERSION: ${{ steps.version.outputs.version }}
